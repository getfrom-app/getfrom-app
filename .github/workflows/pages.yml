name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Antes este workflow subía el repo tal cual, sin compilar — el bundle de
      # producción (app/) dependía de que alguien ejecutara `npm run build` y
      # commiteara el resultado a mano antes de cada deploy. Se quedó parado en
      # v9.8.1 durante casi 48h de sesión (28-30 ago 2026) mientras el código
      # fuente avanzaba hasta v9.10.10 sin que nada de eso llegara nunca a
      # producción — nadie se dio cuenta hasta que Alberto preguntó
      # explícitamente. Ahora el propio pipeline compila `web/` (mismo output
      # a `../app` que ya usa `vite.config.ts`) antes de publicar: empujar el
      # código fuente a `main` basta, no hace falta el paso manual.
      - name: Instalar dependencias
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Compilar web
        working-directory: web
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
